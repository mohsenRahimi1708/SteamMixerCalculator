name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "SteamMixerCalculator-${VERSION}-debug.apk"
          ls -lh SteamMixerCalculator-*.apk

      # Manual runs (workflow_dispatch) have no tag — just upload the APK as an artifact.
      - name: Upload APK artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: SteamMixerCalculator-debug-apk
          path: SteamMixerCalculator-*.apk
          retention-days: 30

      # Tag pushes create (or update) a GitHub Release with the APK attached.
      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          {
            echo "## Steam Mixer Calculator $TAG"
            echo ""
            echo "Debug-signed APK built automatically by GitHub Actions from tag $TAG."
            echo ""
            echo "- **Mode A - Required Spray** (reverse), **Mode B - Spray Impact** (forward), **Transient Simulation**, **Energy Balance**"
            echo "- IAPWS-IF97 steam properties (com.hummeling:if97, LGPL)"
            echo "- Mandatory initial platen metal temperature + thermal-shock advisory"
            echo "- Bilingual in-app Help (EN / فا) with search"
            echo "- Offline, no permissions required"
            echo ""
            echo "Uninstall any previous Python-based build before installing."
            echo ""
            echo "---"
            echo "Created with AI (Codebuff) in association with **Mohsen Rahimi**."
          } > release_notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — uploading asset"
            gh release upload "$TAG" "SteamMixerCalculator-${TAG}-debug.apk" --clobber
          else
            gh release create "$TAG" "SteamMixerCalculator-${TAG}-debug.apk" \
              --title "Steam Mixer Calculator $TAG" \
              --notes-file release_notes.md \
              --latest
          fi
