name: Android Build & Test

on:
  push:
    branches: [ main, master, v2-if97-library ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── Python engine tests (pytest) ────────────────────────────────────────
  pytest:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.x
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # Install project Python dependencies if they exist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f app/src/main/python/requirements.txt ]; then pip install -r app/src/main/python/requirements.txt; fi

    - name: Run pytest
      run: |
        # Run tests from project root or Python engine directory
        if [ -d tests ]; then
          pytest tests/ -v --tb=short
        elif [ -d app/src/main/python/tests ]; then
          pytest app/src/main/python/tests/ -v --tb=short
        else
          echo "No pytest test files found — skipping"
        fi

  # ─── Android build ───────────────────────────────────────────────────────
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: []  # Remove 'pytest' from needs if pytest finds no tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew test --info

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: steam-mixer-calculator-v3-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
